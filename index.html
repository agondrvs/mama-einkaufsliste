<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Einkaufsliste</title>
  <meta name="description" content="Eine einfache, schöne Einkaufsliste.">
  <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Einkauf">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <p class="greeting" id="greeting">Guten Tag</p>
      <h1>Einkaufsliste</h1>
      <p class="count" id="count"></p>
    </header>

    <section class="list-wrap" aria-label="Zu kaufen">
      <ul class="list" id="open-list"></ul>
      <div class="empty" id="empty" hidden>
        <div class="empty-art" aria-hidden="true">🧺</div>
        <p class="empty-title">Alles erledigt</p>
        <p class="empty-text">Schreib unten auf, was du brauchst.</p>
      </div>
    </section>

    <section class="done-wrap" id="done-wrap" aria-label="Im Korb" hidden>
      <div class="done-head">
        <h2>Im Korb</h2>
        <button class="link-btn" id="clear-done" type="button">Aufräumen</button>
      </div>
      <ul class="list list-done" id="done-list"></ul>
    </section>
  </main>

  <footer class="composer">
    <div class="suggestions" id="suggestions" aria-label="Oft gekauft"></div>
    <form class="add" id="add-form" autocomplete="off">
      <input id="add-input" type="text" enterkeyhint="done" placeholder="Was brauchst du?" aria-label="Neuer Artikel" maxlength="60">
      <button class="add-btn" type="submit" aria-label="Hinzufügen">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
      </button>
    </form>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button class="toast-btn" id="toast-undo" type="button">Rückgängig</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
